services:
  intervals-mcp:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: intervals-mcp-server
    restart: unless-stopped
    # Time between SIGTERM and SIGKILL on `docker stop`. The server drains
    # in-flight calls for up to 8 s (SHUTDOWN_GRACE_MS in
    # apps/server/src/httpServer.ts), so keep this above that.
    stop_grace_period: 10s
    # Published on loopback only: both documented tunnels (Tailscale Funnel,
    # cloudflared) reach the server through localhost, and MCP_AUTH_TOKEN is
    # optional. BIND_ADDR=0.0.0.0 in .env publishes it to the LAN again. The
    # container itself still listens on every interface.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    environment:
      - INTERVALS_API_KEY=${INTERVALS_API_KEY}
      - INTERVALS_ATHLETE_ID=${INTERVALS_ATHLETE_ID:-0}
      # UTC (the default) means: follow the athlete's intervals.icu time zone.
      # Etc/UTC pins UTC.
      - TZ=${TZ:-UTC}
      - ORS_API_KEY=${ORS_API_KEY:-}
      - HOME_START=${HOME_START:-}
      - OSM_EXTRACT_URL=${OSM_EXTRACT_URL:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      # Days a stored route (stitch-route, amend-route) is kept after its last
      # use; blank means 30.
      - ROUTE_RETENTION_DAYS=${ROUTE_RETENTION_DAYS:-}
      # Keep in step with ports; the image's healthcheck reads PORT.
      - PORT=3000
    volumes:
      # Stored routes (DATA_DIR=/data in the image). A named volume outlives
      # the container, so routes survive `docker compose up -d` recreating it.
      - route-data:/data

volumes:
  route-data:
