version: 2
updates:
  # bun, not npm: the npm ecosystem refuses a repo whose only lockfile is
  # bun.lock ("misconfigured_tooling"), so every weekly run failed and no
  # version update arrived. The groups and prefixes below behave the same:
  # Dependabot registers a production/development check for bun too.
  # GitHub's docs list no security updates for bun, so the weekly
  # `bun run audit` in ci.yml is what catches a new advisory.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    # Hold a new release back a week before proposing it, so a
    # compromised publish is usually caught and yanked before it lands here.
    # Security updates ignore cooldown.
    cooldown:
      default-days: 7
    # fix(deps), not chore(deps): production deps ship inside the published
    # Docker image (server runtime plus the bundled MCP App HTML), so a bump
    # must cut a patch release or users never receive it. Dev-only tooling
    # stays chore(deps) and produces no release. The groups are split by
    # dependency-type so a grouped PR never mixes the two prefixes.
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    groups:
      # Families that must share one version. Their majors fall outside the
      # minor-patch groups, so each package arrived as its own PR and none
      # could pass alone: vitest refuses mixed versions ("Running mixed
      # versions is not supported"), and Storybook addons peer on the same
      # storybook release. These take every update type, so a major is one
      # PR. They come first because a dependency joins the first group it
      # matches.
      vitest:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "vitest"
          - "@vitest/*"
      storybook:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "storybook"
          - "@storybook/*"
      # Biome minors promote nursery rules into the recommended set and add
      # formatters (2.6 began formatting Markdown), so a bump can fail
      # `bun run lint` or rewrite files the bump never touched. Alone, it
      # never holds the other dev bumps back, and dependabot-auto-merge.yml
      # skips this group so the autofix's reformat gets a human look.
      biome:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "@biomejs/biome"
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
    reviewers:
      - ljcl

  - package-ecosystem: github-actions
    # "/" covers only .github/workflows; each composite action is listed
    # explicitly, since a /.github/actions/* glob can silently match nothing.
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    # Hold a new release back a week before proposing it, so a
    # compromised publish is usually caught and yanked before it lands here.
    # Security updates ignore cooldown.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    reviewers:
      - ljcl

  - package-ecosystem: docker
    directory: "/apps/server"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    # Hold a new release back a week before proposing it, so a
    # compromised publish is usually caught and yanked before it lands here.
    # Security updates ignore cooldown.
    cooldown:
      default-days: 7
    # fix(deps) for the same reason as npm: base-image bumps only reach users
    # via a new release publishing a fresh image.
    commit-message:
      prefix: "fix(deps)"
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    # A Node major moves CI's Node too and can change the system libraries
    # the copied binary needs, so it is a deliberate upgrade, not a bump
    # (docs/development.md, "Upgrading Node").
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    reviewers:
      - ljcl
