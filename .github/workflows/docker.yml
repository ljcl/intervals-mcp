name: Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  # Backfill: tag pushes run this workflow at the tag's commit, so a workflow
  # bug baked into a release tag cannot be fixed by re-running that run. This
  # dispatch builds an existing release tag with the workflow from main and
  # publishes its X.Y.Z / X.Y image tags (it never moves `latest`, `edge` or
  # main-*).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z release tag to build and publish"
        required: true
        type: string

concurrency:
  # The backfill dispatch runs on main's ref, so it gets its own group: sharing
  # main's would let a later main push replace it while it is pending. A PR
  # run gets a group of its own, so it never cancels another PR run: a
  # cancelled run reports docker-ok as failed, and a stack push starts two
  # runs for one commit (see ci.yml).
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('backfill-{0}', inputs.tag) || github.event_name == 'pull_request' && format('pr-run-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  # Decides whether a PR or main push actually touches anything the image
  # consumes. The build legs are skipped (not path-filtered at the workflow
  # level) so that the required `docker-ok` status still reports on docs-only
  # PRs, whereas a path-filtered workflow never reports and would block
  # auto-merge. On main it keeps a
  # docs-only merge from giving `edge` a new digest, which restarts containers
  # under update tools for nothing. Tag pushes and the backfill dispatch bypass
  # the filter entirely, so releases always build.
  changes:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's changed files via the API
    # On main pushes paths-filter diffs against github.event.before in git,
    # fetching the history it needs itself.
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Everything `turbo prune @intervals-mcp/server --docker` can pull into
          # the build context, plus the Docker plumbing itself.
          filters: |
            image:
              - "apps/server/**"
              - "packages/**"
              - "package.json"
              - "bun.lock"
              - "turbo.json"
              - ".dockerignore"
              - ".github/workflows/docker.yml"
              - "scripts/docker-smoke.sh"

  build:
    needs: [changes]
    # Tag pushes and the dispatch skip `changes`, so !cancelled() is needed for
    # this expression to be evaluated at all in that case.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || needs.changes.outputs.image == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on pull_request/push (checks out the triggering ref); the
          # backfill dispatch builds the requested release tag's sources.
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Prepare platform pair
        id: prep
        run: |
          platform="${{ matrix.platform }}"
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"

      # The base images, the buildkit builder image and the SBOM scanner are
      # Docker Hub images. Docker Hub failed the 2.5.0 release builds with 429
      # (anonymous rate limit), 500 and 504, so setup-buildx below pulls them
      # through mirror.gcr.io. Docker Hub is only the fallback for an image
      # the mirror does not hold yet (a fresh Dependabot digest, say), and
      # that fallback is logged in here so it uses the account's limit. The
      # token is unavailable on fork PRs and on Dependabot PRs unless it is
      # also a Dependabot secret; those skip the login and pull anonymously.
      # A failed login (Docker Hub has answered it with HTTP 500) does not
      # fail the leg either: it falls back to anonymous pulls.
      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ] && [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set; Docker Hub pulls are anonymous"
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # mirror.gcr.io is Google's public pull-through mirror of Docker Hub.
      # Every FROM is pinned by digest, so the mirror cannot serve different
      # content, and the Dockerfile keeps its docker.io names for Dependabot,
      # dockerRuntime.test.ts and local builds. BuildKit tries the mirror
      # first and falls back to docker.io on a miss or an error.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Start the image before anything is published: dockerRuntime.test.ts
      # reads the repo tree, so it cannot see what the build context left
      # out, a broken CMD or HEALTHCHECK, uid 65534 permissions, or an
      # arm64-only failure. This loads the same build into the runner's
      # docker (no attestations; the push build below reuses the builder's
      # layers), and a failing leg keeps `merge` from publishing any tag.
      - name: Build for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: intervals-mcp:smoke
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ steps.prep.outputs.pair }}

      # A backfill checks out an old release tag, which may predate the script.
      - name: Smoke test
        run: |
          if [ -x scripts/docker-smoke.sh ]; then
            scripts/docker-smoke.sh intervals-mcp:smoke
          else
            echo "::notice::scripts/docker-smoke.sh is not in this checkout; smoke test skipped"
          fi

      - name: Build (push by digest on non-PR)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # Verified against the published v2.8.0 index rather than assumed:
          # push-by-digest does NOT strip attestations here — BuildKit's default
          # mode=min provenance was already riding along, one attestation
          # manifest per platform. What was actually missing is the SBOM
          # (`.SBOM` inspected empty) and the provenance detail mode=min omits.
          # So this asks for both explicitly; each leg then pushes an index
          # (image + attestation manifests) and `steps.build.outputs.digest` is
          # that index's digest, which is what the merge job feeds to
          # `imagetools create`.
          # mode=max records the full build definition; safe here because the
          # build takes no build-args and no secrets.
          # PR builds push nothing, so they skip both: the attestations would
          # be thrown away, and the SBOM scanner image is a Docker Hub pull
          # (see the login step above and the rate-limit note in the merge job).
          provenance: ${{ github.event_name == 'pull_request' && 'false' || 'mode=max' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ steps.prep.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.prep.outputs.pair }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ steps.prep.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assembles the per-arch digests into one multi-arch manifest. The explicit
  # `needs.build.result == 'success'` guard requires every build matrix leg to
  # have succeeded, so a single-arch manifest can never ship. It must stay
  # explicit: on push events `changes` is skipped, which makes the implicit
  # success() check false for every downstream job, so a bare event-name `if`
  # here would silently skip this job on the very pushes that publish releases.
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.build.result == 'success' }}
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC identity signing the provenance attestation
      attestations: write # writes it to the repository's attestation store
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # No setup-buildx-action here on purpose: `imagetools create`/`inspect`
      # talk to the registry directly and need no BuildKit builder. Setting one
      # up only pulled moby/buildkit from Docker Hub, whose anonymous-pull rate
      # limit intermittently failed this job (the build legs keep their builder).

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # `latest` is the newest release, nothing else: README and SECURITY.md
          # point users at it. latest=false turns off the action's default
          # (latest=auto), which adds `latest` to any non-prerelease semver
          # output, including a backfill of an old tag. It is then set only on a
          # release tag push (a `-` marks a prerelease). Main builds get `edge`
          # and main-<sha>; the dispatch runs on main's ref, so those check the
          # event too, and its semver tags come from the tag input.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # `imagetools create` is load-bearing beyond convenience: each source
      # digest is now an index carrying that platform's attestation manifests,
      # and imagetools copies those children through into the merged index.
      # `docker manifest create` cannot — it rejects a manifest-list source
      # outright — so switching back would silently drop every attestation.
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          shopt -s failglob  # fail loudly if no digest files were downloaded
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(for d in *; do printf '%s@sha256:%s ' "$REGISTRY_IMAGE" "$d"; done)

      - name: Inspect image
        id: inspect
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ref="$REGISTRY_IMAGE:$VERSION"
          docker buildx imagetools inspect "$ref"
          # The index digest, which is what the attestation binds to. Taken from
          # the descriptor rather than a tag lookup: `docker manifest inspect -v`
          # reports a *platform* manifest digest here, which would attest the
          # wrong subject.
          digest="$(docker buildx imagetools inspect "$ref" --format '{{ json .Manifest }}' | jq -r '.digest')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # BuildKit's SBOM and provenance ride along inside the index, but they are
      # not signed — anyone with push access could rewrite them, so on their own
      # they attest to nothing. This binds the published index digest to this
      # workflow's OIDC identity via Sigstore, which is what makes
      # `gh attestation verify` a real check. Left out of the registry
      # (push-to-registry defaults to false) so publishing does not depend on
      # GHCR's referrers API; verification reads GitHub's attestation store.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.inspect.outputs.digest }}

      # Record what shipped in the run summary: the tags applied and, per
      # architecture, the manifest digest and compressed (download) size — the
      # sum of the config blob and layer sizes from each arch manifest.
      # Attestation manifests (platform os/arch "unknown") are filtered out.
      - name: Image summary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$REGISTRY_IMAGE:$VERSION"
          {
            echo "## Docker image"
            echo ""
            echo "Published \`$ref\`"
            echo ""
            echo "**Tags**"
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "- \`$tag\`"
            done <<< "$TAGS"
            echo ""
            echo "| Platform | Digest | Compressed size |"
            echo "| -------- | ------ | --------------- |"
            docker buildx imagetools inspect "$ref" --raw \
              | jq -r '.manifests[]
                  | select(.platform.os != "unknown")
                  | [.platform.os + "/" + .platform.architecture, .digest]
                  | @tsv' \
              | while IFS=$'\t' read -r platform digest; do
                  bytes="$(docker buildx imagetools inspect "$REGISTRY_IMAGE@$digest" --raw \
                    | jq '[.config.size] + [.layers[].size] | add')"
                  human="$(numfmt --to=iec --suffix=B "$bytes")"
                  short="${digest#sha256:}"
                  echo "| $platform | \`${short:0:12}…\` | $human |"
                done
            echo ""
            echo "**Attestations**"
            echo ""
            attestations="$(docker buildx imagetools inspect "$ref" --raw \
              | jq '[.manifests[] | select(.platform.os == "unknown")] | length')"
            echo "- $attestations BuildKit SBOM/provenance manifest(s) in the index"
            echo "- Signed SLSA provenance: \`$DIGEST\`"
            echo ""
            echo "Verify with:"
            echo ""
            echo '```bash'
            echo "gh attestation verify oci://$ref --repo $GITHUB_REPOSITORY"
            echo "docker buildx imagetools inspect $ref --format '{{ json .SBOM }}'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # One stable status context for branch protection to require. The build
  # legs report as `build (linux/amd64, ubuntu-latest)` and so on when they
  # run and as a bare `build` when skipped, so neither name can be required.
  # This passes when every job it needs succeeded or was skipped (a docs-only
  # PR), and fails on any failure or cancellation, so a PR that breaks the
  # image build, Dependabot's included, cannot merge.
  docker-ok:
    needs: [changes, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every Docker job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a Docker job ended '$result'"; exit 1 ;;
            esac
          done
