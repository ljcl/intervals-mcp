name: Publish MCP Registry

# Publishes server.json to the MCP registry on the same v* tag push that makes
# docker.yml build and ship ghcr.io/ljcl/intervals-mcp. The registry proves
# ownership of OCI packages by pulling the image and checking its
# io.modelcontextprotocol.server.name label (set in apps/server/Dockerfile), so
# this job waits for the multi-arch manifest to appear on GHCR before
# publishing. Auth is GitHub OIDC (io.github.ljcl namespace) — no long-lived
# registry token secret.
#
# `validate` also runs on PRs that touch server.json (release-please's release
# PR included), so a registry-side rejection shows up before the tag and the
# image ship rather than after.

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "server.json"
      - ".github/workflows/publish-mcp.yml"
  # Recovery: tag pushes run this workflow at the tag's commit, so a failed
  # publish could otherwise only be fixed by cutting another release. This
  # re-runs the publish for an existing release tag with the workflow from
  # main and the server.json from the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z release tag to publish to the MCP registry"
        required: true
        type: string

concurrency:
  # Keyed on the tag for both a tag push and its recovery dispatch, so the two
  # never publish the same version at once.
  group: ${{ github.workflow }}-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Stamps server.json exactly as a publish would and asks the registry to
  # validate it. The publish job publishes this same file with this same
  # binary, so what was validated is what ships.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on push/pull_request (the triggering ref); the recovery
          # dispatch publishes the requested tag's server.json.
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Stamp version and image tag into server.json
        # release-please keeps $.version current in-repo, but the OCI
        # identifier embeds the image tag, which release-please's json updater
        # cannot template, so the in-repo tag is a placeholder
        # (serverJsonManifest.test.ts). A release takes the version from its
        # tag; a PR takes the version release-please would release.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            version="$(jq -r .version server.json)"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="${TAG#v}"
          else
            echo "::error::'$TAG' is not a vX.Y.Z release tag"
            exit 1
          fi
          jq --arg v "$version" --arg image "$REGISTRY_IMAGE" '
            .version = $v
            | .packages[0].identifier = $image + ":" + $v
          ' server.json > server.json.tmp
          mv server.json.tmp server.json
          jq . server.json

      # Not version-pinned: the registry rejects stale publisher binaries
      # outright ("invalid audience"), so latest is the supported version.
      # Pinned instead is who built it: the tarball must carry a Sigstore
      # signature from the registry repo's own release workflow at that tag,
      # so a swapped release asset fails here rather than running with this
      # job's OIDC token.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install mcp-publisher (signature verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo modelcontextprotocol/registry --json tagName --jq .tagName)
          asset="mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          gh release download "$tag" --repo modelcontextprotocol/registry \
            --pattern "$asset" --pattern "$asset.sigstore.json"
          cosign verify-blob "$asset" \
            --bundle "$asset.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$tag" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          tar xzf "$asset" mcp-publisher
          echo "mcp-publisher $tag" >> "$GITHUB_STEP_SUMMARY"

      # Server-side validation against the live registry's rules (schema plus
      # registry checks such as reserved version strings). Needs no login and
      # does not pull the image.
      - name: Validate with the registry
        run: ./mcp-publisher validate server.json

      - name: Upload validated server.json
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-publish
          path: |
            server.json
            mcp-publisher
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # credentialed view of GHCR, to tell "not pushed" from "private"
      id-token: write # OIDC token for mcp-publisher login github-oidc
    steps:
      - name: Download validated server.json
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry-publish

      - name: Log in to GHCR
        # Only so the wait below can see the package as *we* see it. The check
        # that decides success is the anonymous one.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the GHCR image
        # docker.yml builds both arches and pushes the manifest on this same tag
        # push, so for the first minute or two the manifest legitimately does not
        # exist. That is the only state worth polling through.
        #
        # The registry validates ownership by pulling the image *anonymously* to
        # read its io.modelcontextprotocol.server.name label, so anonymous
        # visibility — not ours — is what has to become true. GHCR creates new
        # container packages private by default even under a public repo, and a
        # private package never becomes anonymously visible on its own: polling
        # it just burns the 20-minute timeout and then blames docker.yml, which
        # had in fact succeeded. So each round asks both questions, and the pair
        # separates the three states: absent (keep waiting), present but private
        # (fail now, with the fix), present and public (proceed).
        env:
          ANON_DOCKER_CONFIG: ${{ runner.temp }}/anon-docker-config
        run: |
          set -euo pipefail
          ref="$(jq -r '.packages[0].identifier' server.json)"
          # An empty config dir carries no credentials, so inspects run through
          # it authenticate exactly the way the registry's verifier will.
          mkdir -p "$ANON_DOCKER_CONFIG"
          for attempt in $(seq 1 40); do
            if DOCKER_CONFIG="$ANON_DOCKER_CONFIG" docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "$ref is published and anonymously pullable."
              exit 0
            fi
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "::error::$ref exists but is not readable anonymously — the GHCR package is private."
              {
                echo "docker.yml succeeded; the image is pushed. The MCP registry proves"
                echo "ownership by pulling it anonymously, so publishing cannot succeed while"
                echo "the package is private."
                echo
                echo "Fix (one-time, and UI-only — GitHub exposes no REST endpoint for package"
                echo "visibility): open"
                echo "  https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}/settings"
                echo "set Package visibility to Public, then re-run this workflow."
              } >&2
              exit 1
            fi
            echo "$ref not published yet (attempt $attempt/40); retrying in 30s..."
            sleep 30
          done
          echo "::error::Timed out waiting for $ref — did the Docker workflow fail?"
          exit 1

      - name: Log in to the MCP registry (GitHub OIDC)
        run: |
          chmod +x mcp-publisher
          ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish server.json

      # Record what was published in the run summary. server.json was stamped
      # with the tag's version and image identifier by the validate job.
      - name: Publish summary
        if: success()
        run: |
          {
            echo "## MCP registry"
            echo ""
            echo "Published \`$(jq -r '.name' server.json)\` version \`$(jq -r '.version' server.json)\`."
            echo ""
            echo "- Package: \`$(jq -r '.packages[0].identifier' server.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"
