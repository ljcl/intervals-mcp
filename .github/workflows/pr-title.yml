name: PR Title

# Squash-merge uses the PR title as the commit subject on main, and
# release-please only bumps versions for Conventional Commit subjects.
# This gate keeps PR titles parseable so releases are not silently skipped.

# pull_request_target runs the base branch's copy of this workflow, so a PR
# cannot edit the required check away. It checks out nothing, runs no PR
# code, and its token is read-only.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The job name is the status context branch protection requires
  # (scripts/setup-branch-protection.sh); renaming it unrequires the check.
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with release-please: types that produce no release
          # (chore, docs, refactor, ci) are still allowed as valid titles.
          types: |
            feat
            fix
            chore
            docs
            refactor
            ci
            perf
            test
            build
            style
            revert
          requireScope: false
