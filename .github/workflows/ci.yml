name: CI

on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` on top of the defaults (opened, synchronize,
    # reopened) so adding or removing the coverage-lower-ok escape hatch
    # label re-runs the Coverage ratchet check without needing an empty
    # commit.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: "23 15 * * 1" # weekly audit run, surfaces new advisories between PRs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Biome runs outside turbo here (unlike the local `check` task) so its
      # GitHub reporter's ::error/::warning workflow commands start the line —
      # turbo's task-name prefix would stop GitHub parsing them. This is what
      # surfaces diagnostics as inline annotations on the PR diff, including
      # warn-level rules that never fail the build.
      - name: Lint
        run: bun run lint --reporter=github

      # Unit tests for the coverage-ratchet comparison logic (#62). Not run
      # through turbo: scripts/ has no vitest config of its own (a
      # default-named root one would hijack every package's bare
      # `vitest run`), so these run on bun:test instead, outside the
      # per-package Coverage step below.
      - name: Script tests
        run: bun run test:scripts

      # `test` is deliberately absent: the Coverage step below runs the same
      # specs through `test:coverage`, and that is the pass which gates (the
      # thresholds live in the vitest configs). Running both executed every
      # spec twice per run and bought nothing (#273).
      - name: Check (PR — affected only)
        if: github.event_name == 'pull_request'
        run: |
          bun run turbo run typecheck build knip --affected
          bun run turbo boundaries

      - name: Check (main — full)
        if: github.event_name == 'push'
        run: |
          bun run turbo run typecheck build knip
          bun run turbo boundaries

      # The unit gate, and now the only place the specs run. Deliberately NOT
      # --affected: turbo restores `coverage/**` for unchanged packages from
      # cache, so a full run costs little and every package the summary table
      # lists still has a coverage file. Only the four packages with a
      # vitest.config.ts (apps/server, data, design-system, ui) check a
      # threshold here; the MCP App packages' floor is the story render-path
      # report. It sits ahead of the browser steps so a failing spec surfaces
      # before the ~2-minute story run rather than after it (#135, #273).
      - name: Coverage
        run: bun run turbo run test:coverage

      # Story smoke tests: every Storybook story renders in real headless
      # Chromium via the Vitest addon (#163). This is the automated UI gate.
      # Both halves of the browser cache key. ImageOS is read HERE, in a shell
      # step, and not as `${{ env.ImageOS }}` in the cache step's `with:` — the
      # env context holds only workflow/job/step-defined variables, so an
      # ambient runner variable interpolates to the empty string there and the
      # key silently loses the segment.
      - name: Resolve Playwright cache key
        id: playwright-key
        run: |
          {
            echo "version=$(bun --print 'require("./package.json").devDependencies.playwright')"
            echo "image=${ImageOS:-unknown}"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # The image is in the key because the browser binaries link against
          # the runner image's system libraries: an image bump must not restore
          # browsers built for the previous one (#274).
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-key.outputs.image }}-playwright-${{ steps.playwright-key.outputs.version }}

      # Split on the cache result (#274). The download is what the cache exists
      # to skip; the apt-get half is not cached and has to run either way, so a
      # hit still installs system deps — just without re-fetching ~150 MB of
      # browser.
      - name: Install Playwright Chromium and system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium --with-deps

      - name: Install Playwright system deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # With coverage: the same story smoke tests, plus a measure of which
      # packages/* source the stories execute in the browser (#197). The
      # summary row lands in the coverage table below.
      - name: Story tests
        run: bun run turbo run test:stories:coverage

      # #62: fails a PR that lowers a committed coverage threshold versus
      # origin/main (escape hatch: the coverage-lower-ok label), and warns,
      # without failing, when a run above just raised a threshold the PR has
      # not committed. Runs after Story tests, not straight after Coverage,
      # so it also sees any in-memory auto-update to
      # vitest.stories.config.ts; PR-only because there is no prior commit
      # to compare a push to main against.
      - name: Coverage ratchet check
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_RATCHET_ESCAPE_HATCH: ${{ contains(github.event.pull_request.labels.*.name, 'coverage-lower-ok') }}
        run: bun scripts/check-coverage-thresholds.ts

      # Restore the latest main coverage snapshot into coverage-baseline/ so the
      # summary can annotate each cell with its delta vs main. Best-effort: the
      # primary key never hits (it is stamped with this run's SHA), so the
      # restore-keys prefix picks the most recent saved baseline; the first main
      # run and fork PRs simply get no baseline and the table degrades to
      # absolute numbers.
      - name: Restore coverage baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: coverage-baseline
          key: coverage-baseline-${{ github.sha }}
          restore-keys: |
            coverage-baseline-

      - name: Publish coverage summary
        run: bun run coverage:summary >> "$GITHUB_STEP_SUMMARY"

      # On main, replace the baseline with this run's coverage and persist it so
      # the next PR diffs against it. Rebuilt from scratch (not the restored
      # copy) so a package that stops emitting coverage drops out of the baseline
      # too. Cached with a SHA-stamped key because cache entries are immutable.
      - name: Stage coverage baseline
        if: github.event_name == 'push'
        run: |
          rm -rf coverage-baseline
          for f in apps/*/coverage/coverage-summary.json \
                   packages/*/coverage/coverage-summary.json \
                   coverage-stories/coverage-summary.json; do
            [ -f "$f" ] || continue
            mkdir -p "coverage-baseline/$(dirname "$f")"
            cp "$f" "coverage-baseline/$f"
          done

      - name: Save coverage baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: coverage-baseline
          key: coverage-baseline-${{ github.sha }}

      # Informational dead-code readout beside the turbo `knip` gate above (a
      # green build already means zero issues). Re-runs the analysis with the
      # JSON reporter; --no-exit-code plus the script's always-zero exit keep it
      # from ever failing the build.
      - name: Knip summary
        if: ${{ !cancelled() }}
        run: |
          bun run knip --reporter json --no-exit-code 2>/dev/null \
            | bun scripts/knip-summary.ts >> "$GITHUB_STEP_SUMMARY" || true

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          # This job runs `bun audit` and no turbo task, so it has nothing to
          # contribute to the cache — and it finishes long before `check`, so
          # left enabled it reserved the SHA key and locked out the save from
          # the job that actually populated `.turbo` (#271).
          turbo-cache: "false"

      - name: Audit dependencies (high severity and above)
        # Advisory on PRs and main pushes: most findings are transitive deps
        # with no local update path, so a hard gate would block unrelated work.
        # The weekly scheduled run DOES fail on findings, so new advisories
        # still surface between PRs (mirrors codeql.yml's cron pattern).
        continue-on-error: ${{ github.event_name != 'schedule' }}
        run: |
          set +e
          bun audit --audit-level=high > audit.txt 2>&1
          status=$?
          cat audit.txt
          { echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
