name: Dependabot auto-merge

# pull_request_target: arming auto-merge needs a write token, which Dependabot
# PRs never get on pull_request. Safe because the job checks out nothing and
# runs no PR code; see the `if` below.
on: pull_request_target # zizmor: ignore[dangerous-triggers]

permissions:
  contents: read

jobs:
  auto-merge:
    # Gated on the PR author, not github.actor: the actor is whoever caused
    # the latest event, so a human (or a re-run) acting on a Dependabot PR
    # can change it. The head-repo check matters even though this job never
    # checks out code: the author check alone is spoofable by enabling
    # Dependabot on a fork, and this job must never arm auto-merge for a PR
    # whose branch this repo's branch protection does not control.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
