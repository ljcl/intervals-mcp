name: Dependabot autofix

# Dependabot bumps package.json but cannot fix the collateral damage a bump
# causes elsewhere in the repo, so its PRs used to go red on failures only a
# human could clear:
#   - bun.lock drift: Dependabot's npm ecosystem did not reliably update
#     Bun's text lockfile in a workspaces monorepo, so `bun install
#     --frozen-lockfile` in the setup composite failed (dependabot-core#14223).
#     dependabot.yml now uses the bun ecosystem, which writes bun.lock
#     itself; the sync step stays as the guard if its result still drifts.
#   - formatter bumps: a new Biome version can format existing code
#     differently, so `bun run lint` fails on files the bump never touched.
#   - toolchain pins: an oven/bun or node image bump leaves packageManager
#     and .tool-versions on the old version, so dockerRuntime.test.ts fails.
# This job syncs those pins, regenerates bun.lock, applies formatter fixes,
# and pushes any resulting fixup commit back to the PR branch so the bump
# lands green.
#
# Runs on pull_request_target because Dependabot PRs get a read-only token on
# the plain pull_request event and so cannot push. Unlike the earlier
# lockfile-only version of this job, `bun run lint:fix` executes a dependency
# binary (Biome), so the privileged context is locked down:
#   - the job only runs for PRs authored by dependabot[bot] (the PR author,
#     not github.actor, which is whoever caused the latest event) from THIS
#     repo; the author check alone is spoofable by enabling Dependabot on a
#     fork, the head-repo check closes that hole;
#   - checkout does not persist credentials, and the push token is exposed
#     only to the final push step, after all dependency code has run; that
#     step's commit and push run with hooks off (core.hooksPath=/dev/null),
#     since dependency code could have written .git/hooks to run there;
#   - bun does not run lifecycle scripts for untrusted dependencies.

on: # zizmor: ignore[dangerous-triggers] (justified above)
  pull_request_target:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Sync toolchain pins with the Dockerfile
        # Dependabot's docker ecosystem bumps the oven/bun and node image tags
        # but never the files that pin the same versions for CI and local
        # installs: root packageManager (Bun) and .tool-versions (Bun, Node).
        # dockerRuntime.test.ts fails until they match. This runs before
        # Install Bun, so the new Bun resolves bun.lock below. The greps let
        # only digits and dots reach sed.
        run: |
          dockerfile=apps/server/Dockerfile
          bun_version=$(grep -oE '^FROM oven/bun:[0-9]+\.[0-9]+\.[0-9]+' "$dockerfile" | cut -d: -f2 | sort -u)
          if [ "$(printf '%s\n' "$bun_version" | grep -c .)" -eq 1 ]; then
            sed -i -E "s/\"packageManager\": \"bun@[0-9.]+\"/\"packageManager\": \"bun@${bun_version}\"/" package.json
            sed -i -E "s/^bun [0-9.]+$/bun ${bun_version}/" .tool-versions
          else
            echo "The oven/bun tags in $dockerfile disagree; leaving the Bun pins alone."
          fi
          node_version=$(grep -oE '^FROM node:[0-9]+\.[0-9]+\.[0-9]+' "$dockerfile" | cut -d: -f2 | sort -u)
          if [ "$(printf '%s\n' "$node_version" | grep -c .)" -eq 1 ]; then
            sed -i -E "s/^nodejs [0-9.]+$/nodejs ${node_version}/" .tool-versions
          fi

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Single source of truth: the packageManager field in root
          # package.json (matches .github/actions/setup).
          bun-version-file: package.json

      - name: Sync bun.lock and install dependencies
        run: bun install

      - name: Apply formatter fixes
        # `biome check --write` exits non-zero when unfixable diagnostics
        # remain; commit whatever it DID fix and let CI report the rest.
        run: bun run lint:fix || true

      - name: Commit and push fixes
        env:
          # A PAT (or app token) is needed for the push to re-trigger the
          # required CI checks — GITHUB_TOKEN pushes deliberately do not.
          # Falls back to GITHUB_TOKEN, which still fixes the PR but won't
          # re-run CI on its own (a manual re-run or re-push is then needed).
          PUSH_TOKEN: ${{ secrets.DEPENDABOT_PAT || secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Toolchain pins, lockfile and formatting already clean — nothing to do."
            exit 0
          fi
          git config user.name 'dependabot[bot]'
          git config user.email '49699333+dependabot[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'chore(deps): sync toolchain pins, bun.lock and formatting with the bump'
          git -c core.hooksPath=/dev/null push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:"$HEAD_REF"
