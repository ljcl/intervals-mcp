name: Setup
description: Install Bun and Node, restore the Turborepo cache, and install dependencies. Caller must run actions/checkout first.
inputs:
  turbo-cache:
    description: >-
      Restore and save the .turbo cache. Set to "false" in a job that runs no
      turbo task: cache entries are immutable and the first job to post one
      wins, so a job with nothing to contribute reserves the key and the job
      that did the work cannot save (#271).
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        # Single source of truth: the packageManager field in root
        # package.json. Dependabot bumps the Docker base image, never this
        # field, so apps/server/src/dockerRuntime.test.ts pins the
        # Dockerfile's FROM tags to packageManager: a base-image bump goes red
        # until packageManager moves with it.
        bun-version-file: package.json

    # `bun run` hands Node-shebang tools (vitest, vite, knip, Storybook) to
    # whatever `node` is on PATH, so without this the runner image picks the
    # Node version. .tool-versions pins it; dockerRuntime.test.ts pins that
    # line to a full x.y.z and the Dockerfile's Node to the same version.
    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .tool-versions
        # Nothing here installs through npm; bun owns the install and the
        # Turborepo cache below.
        package-manager-cache: false

    - name: Restore Turborepo cache
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        # Namespaced per workflow and job. CI's `check` and Storybook's
        # `deploy` both run turbo tasks against the same main-push SHA, and on
        # a shared key whichever finishes first saves while the other's save is
        # rejected as a duplicate. The bare prefix stays in restore-keys, so a
        # job with no namespaced entry yet still seeds from the newest cache.
        key: ${{ runner.os }}-turbo-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.workflow }}-${{ github.job }}-
          ${{ runner.os }}-turbo-

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash
